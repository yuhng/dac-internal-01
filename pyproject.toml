[project]
name = "mycareerai"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "yuhng", email = "yuhng1@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "jsonschema>=4.26.0",
    "openai>=3.51.0",
    "psycopg[binary]>=3.3.6",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
