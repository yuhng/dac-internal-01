[project]
name = "mycareerai"
version = "0.1.0"
description = "CV improvement pipeline: CV/JD retrieval, reranking, LLM gap analysis and recommendations"
authors = [
    { name = "yuhng", email = "yuhng1@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-core>=1.8.0",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.50.0",
    "peft>=0.21.3",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
]

[tool.uv]
# Code runs from the repo root as src.module.improvement.*; nothing to build/install.
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
